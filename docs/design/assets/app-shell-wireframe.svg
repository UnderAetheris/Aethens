    <rect x="956" y="444" width="280" height="6" rx="3" fill="#1A1F2A"/><rect x="956" y="444" width="168" height="6" rx="3" fill="#2BD9A0"/>
    <text x="956" y="486">Approvals inbox</text>
    <rect x="956" y="498" width="280" height="6" rx="3" fill="#1A1F2A"/><rect x="956" y="498" width="56" height="6" rx="3" fill="#7C5CFF"/>
    <text x="956" y="540">Guardian read-only</text>
    <rect x="956" y="552" width="280" height="6" rx="3" fill="#1A1F2A"/>
