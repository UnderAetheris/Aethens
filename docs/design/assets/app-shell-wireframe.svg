  <text x="256" y="112" fill="#F2F4F8" font-size="26" font-weight="600">Good afternoon. 2 things need you.</text>
  <text x="256" y="138" fill="#A7AEBD" font-size="14">Overnight: studied 4 sources, proposed 1 skill, coding pass rate 71% to 74%.</text>
