    <text x="185" y="214" fill="#0B0D12" font-size="11" font-weight="700">3</text>
    <text x="44" y="251">Memory</text>
    <text x="44" y="287">Skills</text>
    <text x="44" y="323">Research</text>
    <text x="44" y="359">Guardian</text>
    <text x="44" y="395">Reports &amp; Level</text>
  </g>
  <rect x="12" y="700" width="208" height="76" rx="12" fill="#1A1F2A"/>
