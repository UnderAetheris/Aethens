  <rect x="160" y="716" width="44" height="22" rx="11" fill="#2BD9A0"/>
  <circle cx="193" cy="727" r="8" fill="#0B0D12"/>
  <text x="28" y="758" fill="#6B7385" font-size="11">Budget 34 / 200 requests</text>
