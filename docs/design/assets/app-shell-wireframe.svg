    <circle cx="284" cy="430" r="5" fill="#2BD9A0"/><text x="300" y="435" fill="#F2F4F8">Planned: add tests for router fallback</text><text x="800" y="435" fill="#6B7385">2m</text>
    <circle cx="284" cy="466" r="5" fill="#7C5CFF"/><text x="300" y="471" fill="#F2F4F8">Safety: write_file allowed (workspace, undo ready)</text><text x="800" y="471" fill="#6B7385">2m</text>
    <circle cx="284" cy="502" r="5" fill="#FF5C7A"/><text x="300" y="507" fill="#F2F4F8">Test failed: test_fallback_on_429, reflecting</text><text x="800" y="507" fill="#6B7385">1m</text>
    <circle cx="284" cy="538" r="5" fill="#2BD9A0"/><text x="300" y="543" fill="#F2F4F8">Repair passed on attempt 2, lesson saved</text><text x="800" y="543" fill="#6B7385">now</text>
  </g>
  <rect x="936" y="364" width="320" height="412" rx="16" fill="#11141B" stroke="#232938"/>
  <text x="956" y="396" fill="#A7AEBD" font-size="12" letter-spacing="1">GOALS</text>
  <g font-size="13" fill="#F2F4F8">
